<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbi — Deep-space mascot prototype</title>
<style>body { margin: 0; padding: 24px; background: #050911; } main { max-width: 736px; margin: auto; } @media (max-width: 420px) { body { padding: 8px; } }</style>
</head>
<body>
<main>
<div id="orbi-deep-space" aria-label="Orbi space mascot concept">
  <style>
    #orbi-deep-space { font-family: Inter, system-ui, sans-serif; color:#dcecff; }
    #orbi-deep-space .stage { background:radial-gradient(ellipse at 50% 44%,#10283f 0%,#080f1e 52%,#050911 100%); border-radius:24px; overflow:hidden; position:relative; }
    #orbi-deep-space canvas { width:100%; height:440px; display:block; }
    #orbi-deep-space .caption { padding:20px 24px 0; display:flex; justify-content:space-between; gap:12px; color:#98b3cf; }
    #orbi-deep-space .caption strong { font-weight:500; color:#e7f7ff; }
    #orbi-deep-space .controls { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; padding:0 16px 24px; }
    #orbi-deep-space button { border:1px solid #2a4157; border-radius:22px; padding:10px 18px; background:#101e30; color:#bacce0; font:inherit; cursor:pointer; }
    #orbi-deep-space button[aria-pressed="true"] { background:#173e50; color:#b5f3ff; border-color:#579bb2; }
    #orbi-deep-space button:focus-visible { outline:2px solid #a3edff; outline-offset:3px; }
    @media(max-width:420px) { #orbi-deep-space canvas {height:340px;} #orbi-deep-space .caption {padding:18px 18px 0;} }
  </style>
  <div class="stage">
    <div class="caption"><strong>Orbi</strong><span>Deep-space companion</span></div>
    <canvas role="img" aria-label="Midnight-blue Orbi with luminous eyes, two tilted orbital rings, and three satellites passing in front of and behind his body."></canvas>
    <div class="controls" aria-label="Preview Orbi states">
      <button type="button" data-state="idle" aria-pressed="true">Idle</button>
      <button type="button" data-state="researching" aria-pressed="false">Researching</button>
      <button type="button" data-state="happy" aria-pressed="false">Happy</button>
      <button type="button" data-pause aria-pressed="false">Pause motion</button>
    </div>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('orbi-deep-space');
  const canvas = root.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const config = { accent:'#8de5ff', speed:1, rings:true };
  let state='idle', paused=reduced.matches, t=0, last=0, w=0, h=0;
  const pause = root.querySelector('[data-pause]');
  function syncPause() { pause.textContent=paused?'Play motion':'Pause motion'; pause.setAttribute('aria-pressed',String(paused)); }
  syncPause();
  pause.onclick=()=>{paused=!paused;syncPause();draw();};
  reduced.addEventListener('change',e=>{paused=e.matches;syncPause();draw();});
  root.querySelectorAll('[data-state]').forEach(button=>button.onclick=()=>{
    state=button.dataset.state;
    root.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
    draw();
  });
  function resize() {
    const rect=canvas.getBoundingClientRect(); w=rect.width;h=rect.height;
    const dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);draw();
  }
  const observer=new ResizeObserver(resize);observer.observe(canvas);
  function circle(x,y,r,fill) {ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();}
  function point(a,ring) {
    const tilt=ring===0?-.32+Math.sin(t*.12)*.17:1.08+Math.sin(t*.09)*.22;
    const radius=ring===0?167:151;
    const x=radius*Math.cos(a),y=radius*.34*Math.sin(a);
    return {x:x*Math.cos(tilt)-y*Math.sin(tilt),y:x*Math.sin(tilt)+y*Math.cos(tilt),z:Math.sin(a)};
  }
  function orbitLine(ring,front,phase) {
    ctx.lineWidth=ring===0?1.1:.8;
    for(let i=0;i<180;i++) {
      const a=i*Math.PI*2/180,b=(i+1)*Math.PI*2/180;
      const p=point(a,ring),q=point(b,ring);
      if((p.z>=0)!==front)continue;
      ctx.strokeStyle=front?'rgba(135,214,246,.40)':'rgba(97,153,202,.21)';
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
    }
    // A moving luminous arc makes travel along each ring visible.
    for(let i=0;i<26;i++) {
      const a=phase-i*.014,b=a-.014,p=point(a,ring),q=point(b,ring);
      if((p.z>=0)!==front)continue;
      ctx.strokeStyle=`rgba(141,229,255,${(1-i/26)*.8})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
    }
  }
  function satellite(angle,ring,front,size,color) {
    const p=point(angle,ring);if((p.z>=0)!==front)return;
    ctx.save();ctx.shadowColor=color;ctx.shadowBlur=13;
    const g=ctx.createRadialGradient(p.x-2,p.y-2,0,p.x,p.y,size);
    g.addColorStop(0,'#effcff');g.addColorStop(.3,color);g.addColorStop(1,'#245c84');
    circle(p.x,p.y,size*(.85+.15*p.z),g);ctx.restore();
  }
  function draw() {
    if(!w||!h)return;
    ctx.clearRect(0,0,w,h);
    // Deterministic, quiet star field; no random flicker.
    for(let i=0;i<48;i++) {
      const x=((i*137.508)%997)/997*w,y=((i*223.17+91)%991)/991*h;
      circle(x,y,i%9===0?1.1:.6,`rgba(173,203,235,${i%5===0?.48:.19})`);
    }
    const scale=Math.min(w/410,h/380,1.15);
    ctx.save();ctx.translate(w/2,h/2+Math.sin(t*.7)*5);ctx.scale(scale,scale);
    const halo=ctx.createRadialGradient(0,0,68,0,0,185);
    halo.addColorStop(0,'rgba(35,111,151,.14)');halo.addColorStop(1,'rgba(35,111,151,0)');circle(0,0,185,halo);
    const a=t*.38+.35,b=-t*.28+2.2;
    function orbits(front) {
      if(!config.rings)return;
      orbitLine(0,front,a);orbitLine(1,front,b);
      satellite(a,0,front,7,config.accent);
      satellite(a+Math.PI,0,front,4,'#eef4ff');
      satellite(b,1,front,5,'#65b7e5');
    }
    orbits(false);
    ctx.save();ctx.shadowColor='#61d3fb';ctx.shadowBlur=18;
    const body=ctx.createRadialGradient(-39,-48,3,6,10,116);
    body.addColorStop(0,'#456780');body.addColorStop(.31,'#203e5a');body.addColorStop(.72,'#101f37');body.addColorStop(1,'#050e20');
    circle(0,0,99,body);ctx.restore();
    ctx.beginPath();ctx.arc(0,0,98.7,0,Math.PI*2);ctx.strokeStyle='rgba(132,224,255,.48)';ctx.lineWidth=1.3;ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,94,3.45,5.27);ctx.strokeStyle='rgba(175,237,255,.30)';ctx.lineWidth=2;ctx.stroke();
    // Subtle glass visor keeps the face readable against orbital paths.
    ctx.beginPath();ctx.roundRect(-62,-40,124,75,34);ctx.fillStyle='rgba(2,12,26,.40)';ctx.fill();
    let gaze=state==='researching'?Math.sin(t*1.1)*6:Math.sin(t*.35)*2;
    const blink=!paused&&t%5.7>5.53;
    ctx.save();ctx.translate(gaze,-3);ctx.shadowColor=config.accent;ctx.shadowBlur=18;
    ctx.strokeStyle=config.accent;ctx.fillStyle=config.accent;ctx.lineWidth=7;ctx.lineCap='round';
    for(const x of [-24,24]) {
      if(state==='happy') {ctx.beginPath();ctx.arc(x,4,11,Math.PI,2*Math.PI);ctx.stroke();}
      else {const eh=blink?4:state==='researching'?29:33;ctx.beginPath();ctx.roundRect(x-7,-eh/2,14,eh,7);ctx.fill();}
    }
    ctx.restore();
    ctx.beginPath();ctx.arc(0,13,10,.22,Math.PI-.22);ctx.strokeStyle='rgba(160,228,249,.65)';ctx.lineWidth=2;ctx.stroke();
    // Instrument markings on the shell, not extra facial features.
    for(let i=0;i<3;i++)circle(-8+i*8,66,1.3,i===1?config.accent:'#4c708d');
    orbits(true);ctx.restore();
  }
  function frame(now) {
    if(!root.isConnected){observer.disconnect();return;}
    const dt=last?Math.min((now-last)/1000,.05):0;last=now;
    if(!paused&&!document.hidden){t+=dt*config.speed*(state==='researching'?1.8:1);draw();}
    requestAnimationFrame(frame);
  }
  if(globalThis.Tweak) {
    const tweak=new Tweak({container:root,onChange:draw});
    tweak.addColorPicker(config,'accent',{label:'Starlight color'});
    tweak.addSlider(config,'speed',{label:'Orbital speed',min:.2,max:2,step:.1});
    tweak.addToggle(config,'rings',{label:'Orbital rings'});
  }
  resize();requestAnimationFrame(frame);
})();
</script>

</main>
</body>
</html>
