# Orbit — full stack for local development.
# Brings up the database, backend, and frontend so they run and communicate together
# (user story US-14). Provider-agnostic: nothing here is tied to a specific cloud.
#
#   docker compose up --build
#
# Config comes from a local `.env` (see `.env.example`); the values below are the
# development defaults so the stack boots with zero manual setup.

# Explicit project name so container/network names don't depend on the folder name.
name: orbit

services:
  db:
    # pgvector image = PostgreSQL 16 with the pgvector extension available (ADR 0002).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit}
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Runs once on first init: CREATE EXTENSION vector.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbit} -d ${POSTGRES_DB:-orbit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_DATABASE_URL: ${APP_DATABASE_URL:-postgresql+psycopg://orbit:orbit@db:5432/orbit}
      # Market data (US-4). Supplied from .env; empty until a key is configured.
      APP_MARKET_DATA_PROVIDER: ${APP_MARKET_DATA_PROVIDER:-tiingo}
      APP_MARKET_DATA_API_KEY: ${APP_MARKET_DATA_API_KEY:-}
      APP_MARKET_DATA_CACHE_TTL_HOURS: ${APP_MARKET_DATA_CACHE_TTL_HOURS:-24}
    ports:
      - "8000:8000"
    volumes:
      # Live-reload the source during development.
      - ./backend:/app
    # Apply DB migrations before serving (Alembic; see ADR 0010).
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      # The browser runs on the host, so it reaches the backend via the published port.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Keep the image's node_modules; don't let the host bind mount shadow it.
      - /app/node_modules

volumes:
  db_data:
