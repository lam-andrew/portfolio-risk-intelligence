name: CI

# Build the container images and run the test suites on every push and PR (US-14):
# the same images that get deployed are the ones built and tested here.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  local-embedding-spike:
    name: Local embeddings — CPU prototype checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build amd64 experimental image
        run: docker build --platform linux/amd64 --target test -t orbit-embedding-test experiments/local_embeddings
      - name: Offline tests
        run: docker run --rm --network none orbit-embedding-test
      - name: Lint and formatting
        run: |
          docker run --rm orbit-embedding-test ruff check --no-cache --select E,F,I,UP,B .
          docker run --rm orbit-embedding-test ruff format --no-cache --check .
      - name: Type check prototype
        run: docker run --rm orbit-embedding-test mypy --cache-dir /tmp/mypy --check-untyped-defs --ignore-missing-imports model.py service.py benchmark.py download_model.py
      - name: Audit runtime requirements
        run: docker run --rm orbit-embedding-test pip-audit -r requirements.txt

  backend:
    name: Backend — lint, type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t orbit-backend ./backend
      - name: Ruff lint
        run: docker run --rm orbit-backend ruff check .
      - name: Ruff format check
        run: docker run --rm orbit-backend ruff format --check .
      - name: Mypy type check
        run: docker run --rm orbit-backend mypy app
      - name: Pytest
        run: docker run --rm orbit-backend pytest

  frontend:
    name: Frontend — lint, type-check, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build frontend image
        run: docker build -t orbit-frontend ./frontend
      - name: ESLint
        run: docker run --rm orbit-frontend npm run lint
      - name: Prettier format check
        run: docker run --rm orbit-frontend npm run format:check
      - name: TypeScript type check
        run: docker run --rm orbit-frontend npm run typecheck
      - name: Unit tests
        run: docker run --rm orbit-frontend npm run test
      - name: Production build
        run: docker run --rm orbit-frontend npm run build

  integration:
    name: Integration — full stack boots & communicates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bring up the stack
        run: docker compose up -d --build
      - name: Wait for the backend to report healthy with a connected database
        run: |
          for i in $(seq 1 30); do
            body="$(curl -sf http://localhost:8000/api/health || true)"
            echo "attempt $i: $body"
            if echo "$body" | grep -q '"database":"connected"'; then
              echo "Backend healthy and database connected."
              exit 0
            fi
            sleep 3
          done
          echo "Backend did not become healthy in time." >&2
          docker compose logs --no-color >&2
          exit 1
      - name: Filing ingestion, native PostgreSQL search and question retrieval
        run: docker compose exec -T -e APP_TEST_POSTGRES=1 backend pytest tests/test_filings_postgres.py tests/test_questions_postgres.py
      - name: Tear down
        if: always()
        run: docker compose down -v
